plugins { id 'com.android.application' }
android {
    namespace 'com.timesquest.adventure'
    compileSdk 36
    defaultConfig { applicationId 'com.timesquest.adventure'; minSdk 26; targetSdk 36; versionCode 4; versionName '0.1.3'; testInstrumentationRunner 'com.timesquest.adventure.QuestInstrumentation' }
    flavorDimensions += 'store'
    productFlavors { amazon { dimension 'store' }; standalone { dimension 'store' } }
    def signingValues = ['TIMESQUEST_KEYSTORE','TIMESQUEST_STORE_PASSWORD','TIMESQUEST_KEY_ALIAS','TIMESQUEST_KEY_PASSWORD'].collect { System.getenv(it) }
    def hasSigning = signingValues.every { it != null && !it.isEmpty() }
    if (signingValues.any { it != null && !it.isEmpty() } && !hasSigning) throw new GradleException('Supply all four TIMESQUEST signing environment variables, or none for an unsigned build.')
    signingConfigs {
        publisher {
            if (hasSigning) {
                storeFile file(signingValues[0]); storePassword signingValues[1]; keyAlias signingValues[2]; keyPassword signingValues[3]
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.dev' }
        release { minifyEnabled false; if (hasSigning) signingConfig signingConfigs.publisher }
    }
    buildFeatures { buildConfig true }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '1536m'
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
dependencies {
    implementation project(':core')
    amazonImplementation 'com.amazon.device:amazon-appstore-sdk:3.0.9'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}

